services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: toth
      POSTGRES_PASSWORD: toth
      POSTGRES_DB: toth
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "toth", "-d", "toth"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
